# Bookmarks of the default profile only: no history, passwords, cookies or
# sign-in. The list of extensions comes with extension support later.
# With sync turned on, Google Chrome may replace these with the synced bookmarks.
id: chrome
name: Google Chrome
locations:
  windows: "{localappdata}/Google/Chrome/User Data"
  macos: "{app_support}/Google/Chrome"
files:
  - path: Default/Bookmarks
    format: json
cross_os: true
processes:
  windows: [chrome.exe]
  macos: ["Google Chrome.app"]
