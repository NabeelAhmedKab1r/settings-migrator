id: obs
name: OBS Studio
locations:
  windows: "{appdata}/obs-studio"
  macos: "{app_support}/obs-studio"
files:
  - path: global.ini
    format: ini
    translate: [line-endings]
  # OBS 31 and later moved user settings out of global.ini.
  - path: user.ini
    format: ini
    translate: [line-endings]
  - path: basic/profiles/
    translate: [absolute-paths, line-endings]
  - path: basic/scenes/
    translate: [absolute-paths]
exclude:
  # Holds the stream key.
  - "**/service.json"
  - "**/*.bak"
cross_os: true
processes:
  windows: [obs64.exe]
  macos: ["OBS.app"]
