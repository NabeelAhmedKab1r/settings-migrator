id: vscode
name: Visual Studio Code
locations:
  windows: "{appdata}/Code/User"
  macos: "{app_support}/Code/User"
files:
  - path: settings.json
    format: json
    translate: [absolute-paths, line-endings]
  - path: keybindings.json
    format: json
    translate: [modifier-keys, line-endings]
  - path: snippets/
    translate: [line-endings]
exclude:
  - globalStorage/
  - workspaceStorage/
extensions:
  list: "code --list-extensions"
  install: "code --install-extension {id}"
cross_os: true
processes:
  windows: [Code.exe]
  macos: ["Visual Studio Code.app"]
