id: vlc
name: VLC media player
locations:
  windows: "{appdata}/vlc"
  macos: "{preferences}/org.videolan.vlc"
files:
  - path: vlcrc
    format: ini
    translate: [absolute-paths, line-endings]
  # Qt interface settings. The macOS app has its own interface instead.
  - path: vlc-qt-interface.ini
    format: ini
    os: windows
cross_os: true
processes:
  windows: [vlc.exe]
  macos: ["VLC.app"]
