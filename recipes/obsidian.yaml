# App settings only. Vaults (and each vault's .obsidian folder) are the user's own files.
# Obsidian writes these files itself and the dictionary holds a checksum,
# so line endings are left exactly as they are.
id: obsidian
name: Obsidian
locations:
  windows: "{appdata}/obsidian"
  macos: "{app_support}/obsidian"
files:
  - path: obsidian.json
    format: json
    translate: [absolute-paths]
  - path: Preferences
    format: json
  - path: Custom Dictionary.txt
cross_os: true
processes:
  windows: [Obsidian.exe]
  macos: ["Obsidian.app"]
