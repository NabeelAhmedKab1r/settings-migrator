name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p settings-migrator-cli -- --version
      # Smoke test against an empty fake home, never the runner's real settings.
      - run: cargo run -p settings-migrator-cli -- --home "${{ runner.temp }}/fake-home" scan

  # The desktop app: its Rust side is tested with the workspace above; this
  # tests and builds the React side, then builds the app with it embedded.
  desktop:
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck:e2e
      - run: npm run build
      # A debug build without installers: checks the app compiles and links
      # on each OS with the frontend embedded, without the release wait.
      - run: npm run tauri -- build --debug --no-bundle

  # UI tests of every screen and error state, with the engine scripted:
  # WebKit on macOS (what Tauri uses there), Chromium on Windows (WebView2's
  # engine). Screenshots of every screen are uploaded as an artifact. Like
  # every test in app/e2e, they refuse to run outside GitHub Actions or
  # without a stand-in home in the runner's temp folder.
  ui-tests:
    name: UI tests (${{ matrix.browser }} on ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            browser: chromium
          - os: macos-latest
            browser: webkit
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:ui
        env:
          SETTINGS_MIGRATOR_HOME: ${{ runner.temp }}/ui-home
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots-${{ matrix.browser }}
          path: |
            app/e2e/ui/screenshots
            app/e2e/ui/report
            app/e2e/ui/results
          if-no-files-found: warn

  # The real desktop app, driven by WebdriverIO through tauri-driver (which
  # supports Windows but not macOS), against stand-in homes in the runner's
  # temp folder: save, secret review, restore preview, restore and undo,
  # checking the files on disk at each step. Also saves the Windows sample
  # settings for the cross-OS app test below. On failure, the driver, app
  # and WebdriverIO logs are uploaded as the real-app-logs-windows artifact.
  # Allowed to fail for now (continue-on-error) while it's being made to
  # work; remove that once it passes.
  e2e-windows:
    name: Real-app tests (Windows)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run tauri -- build --debug --no-bundle
      - run: cargo install tauri-driver --locked
      # tauri-driver needs the Edge WebDriver matching the WebView2 runtime.
      - name: Get the WebView2 driver
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          $dir = Join-Path $env:RUNNER_TEMP 'edgedriver'
          try {
            if (-not $version) { throw 'no WebView2 runtime version found' }
            Write-Host "WebView2 runtime $version"
            $zip = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
            Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
            Expand-Archive $zip -DestinationPath $dir -Force
            "EDGE_DRIVER=$(Join-Path $dir 'msedgedriver.exe')" >> $env:GITHUB_ENV
          } catch {
            Write-Host "Using the runner's Edge driver instead: $_"
            "EDGE_DRIVER=$(Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe')" >> $env:GITHUB_ENV
          }
      # wdio.conf.ts gives up within a few minutes on its own; this limit
      # is in case something hangs outside it.
      - run: npm run test:e2e
        timeout-minutes: 6
        env:
          SETTINGS_MIGRATOR_HOME: ${{ runner.temp }}/e2e
      # After a failure: the versions involved, and the app started on its
      # own for 15 s (on a stand-in home) to catch a crash at startup.
      - name: Collect diagnostics
        if: failure()
        shell: pwsh
        env:
          SETTINGS_MIGRATOR_HOME: ${{ runner.temp }}/e2e-diagnostics-home
        run: |
          $logs = Join-Path $PWD 'e2e/app/logs'
          New-Item -ItemType Directory -Force -Path $logs, $env:SETTINGS_MIGRATOR_HOME | Out-Null
          $out = Join-Path $logs 'diagnostics.txt'
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          "WebView2 runtime: $((Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv)" | Out-File $out
          "EDGE_DRIVER: $env:EDGE_DRIVER" | Out-File $out -Append
          if ($env:EDGE_DRIVER -and (Test-Path $env:EDGE_DRIVER)) { & $env:EDGE_DRIVER --version 2>&1 | Out-File $out -Append }
          else { 'Edge driver not found at that path' | Out-File $out -Append }
          "tauri-driver: $((Get-Command tauri-driver -ErrorAction SilentlyContinue).Source)" | Out-File $out -Append
          $app = Join-Path $PWD '../target/debug/settings-migrator-desktop.exe'
          "app: $app (exists: $(Test-Path $app))" | Out-File $out -Append
          if (Test-Path $app) {
            $proc = Start-Process -FilePath $app -PassThru `
              -RedirectStandardOutput (Join-Path $logs 'app-stdout.log') `
              -RedirectStandardError (Join-Path $logs 'app-stderr.log')
            Start-Sleep -Seconds 15
            if ($proc.HasExited) { "app exited on its own with code $($proc.ExitCode)" | Out-File $out -Append }
            else { 'app still running after 15 s (started fine)' | Out-File $out -Append; Stop-Process -Id $proc.Id -Force }
          }
          Get-Content $out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-app-logs-windows
          path: |
            app/e2e/app/logs
            app/e2e/app/screenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: app-bundle-from-windows
          path: ${{ runner.temp }}/e2e/cross-os-capture/out/bundle.zip
          if-no-files-found: error

  # Cross-OS app test: the settings file the real app saved on Windows,
  # restored with the command-line tool on macOS into a fake home, checked
  # file by file against the expected results (and undone).
  cross-os-app-restore:
    name: Cross-OS app test (app on Windows, CLI on macOS)
    needs: e2e-windows
    runs-on: macos-latest
    # Allowed to fail for now, like e2e-windows above.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: app-bundle-from-windows
          path: ${{ runner.temp }}/app-bundle
      - run: cargo test -p settings-migrator-cli --test cross_os
        env:
          CROSS_OS_BUNDLE: ${{ runner.temp }}/app-bundle/bundle.zip

  # Cross-OS: capture the sample settings of all 5 recipes on one OS, then
  # restore that bundle on a runner of the other OS and check every file.
  cross-os-capture:
    name: Cross-OS capture (${{ matrix.source }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            source: windows
          - os: macos-latest
            source: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The sample home in the repo, never the runner's own settings.
      - run: cargo run -p settings-migrator-cli -- --home crates/engine/tests/fixtures/cross-os/${{ matrix.source }}-home capture -o "${{ runner.temp }}/bundle.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-from-${{ matrix.source }}
          path: ${{ runner.temp }}/bundle.zip
          if-no-files-found: error

  cross-os-restore:
    name: Cross-OS restore (${{ matrix.source }} to ${{ matrix.target }})
    needs: cross-os-capture
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            source: windows
            target: macos
          - os: windows-latest
            source: macos
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: bundle-from-${{ matrix.source }}
          path: ${{ runner.temp }}/bundle
      # Restores into a fake home and compares with the expected files.
      - run: cargo test -p settings-migrator-cli --test cross_os
        env:
          CROSS_OS_BUNDLE: ${{ runner.temp }}/bundle/bundle.zip
