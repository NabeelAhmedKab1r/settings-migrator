[package]
name = "settings-migrator-engine"
description = "Engine that captures, translates and restores app settings."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
globset = "0.4"
humantime = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "4", default-features = false, features = ["deflate"] }
